# This workflow will build the Python package and publish it to PyPI using
# PyPI's Trusted Publishing (OIDC) whenever a commit is pushed to master, or
# when run manually via workflow_dispatch.
#
# One-time setup required before this will work: on pypi.org, go to the
# "odsl" project's Publishing settings and add a trusted publisher for:
#   - Owner:     OpenDataDSL
#   - Repository: odsl-python-sdk
#   - Workflow:  python-publish.yml
#   - Environment: (leave blank, or set to "pypi" and add that below)
# See: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # required for PyPI Trusted Publishing

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1